[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disclosure-gap"
version = "0.1.0"
description = "Check whether government domains publish a security.txt (RFC 9116), per country."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Zayd Mulani" }]
keywords = ["security.txt", "rfc9116", "vulnerability disclosure", "government", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Security",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/zaydmulani09/disclosure-gap"
Dataset = "https://huggingface.co/datasets/zaydmulani/disclosure-gap"

[project.scripts]
disclosure-gap = "disclosure_gap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/disclosure_gap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
